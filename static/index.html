<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171a21" id="theme-color" />
  <meta name="color-scheme" content="dark light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AI Spend Tracker</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="application-name" content="AI Spend Tracker" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="modal" role="dialog" aria-label="AI Spend Tracker">
    <div id="titlebar">
      <a class="brand" href="https://github.com/littletechbird" target="_blank" rel="noopener noreferrer" aria-label="littletechbird on GitHub">
        <img src="/icons/littletechbird.png" width="18" height="18" alt="" />
        <span class="brand-tip"><strong>littletechbird</strong> · github.com/littletechbird</span>
      </a>
      <h1>AI Spend Tracker</h1>
      <span class="meta">Updated <span id="updated">—</span></span>
      <span id="fetch-chip" class="chip" hidden></span>
      <button type="button" class="btn primary" id="refresh">
        <span class="btn-label">Refresh</span>
      </button>
    </div>
    <div id="toolbar" class="toolbar">
      <label class="tog"><input type="checkbox" id="privacy" /> Privacy mask</label>
      <label class="tog">Filter
        <select id="filter">
          <option value="all">All visible</option>
          <option value="ok">OK only</option>
          <option value="issues">Needs attention</option>
        </select>
      </label>
      <label class="tog">Theme
        <select id="theme" aria-label="Theme">
          <option value="system">System</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
      <button type="button" class="btn" id="manage-rows" title="Hide / unhide / reorder">Rows…</button>
      <span class="hint" id="privacy-hint">Privacy mask optional</span>
    </div>
    <div id="row-panel" class="row-panel" hidden>
      <div class="row-panel-head">Rows (drag order · eye to hide)</div>
      <ul id="row-list"></ul>
      <button type="button" class="btn" id="row-panel-done">Done</button>
    </div>
    <div id="body">
      <div id="error" class="error" aria-live="polite"></div>
      <table>
        <colgroup>
          <col class="c-account" />
          <col class="c-sub" />
          <col class="c-limit" />
          <col class="c-current" />
          <col class="c-reset" />
          <col class="c-status" />
        </colgroup>
        <thead>
          <tr>
            <th>Account</th>
            <th>Sub-level / plan</th>
            <th>Limit</th>
            <th>Current spend / balance</th>
            <th>Next reset</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    <div id="footer">
      <span>zero billable refreshes · cache preferred</span>
      <span id="poll-status">Starting…</span>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
  </script>
</body>
</html>
